
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ग्राम पंचायत गेहूंखेड़ी जागीर — जनसंपर्क</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f7fa;
      color: #222;
      line-height: 1.6;
    }
    header {
      background: #176b43;
      color: white;
      padding: 24px 16px;
      text-align: center;
    }
    main {
      max-width: 650px;
      margin: 20px auto;
      padding: 0 16px;
    }
    section {
      background: white;
      padding: 20px;
      margin-bottom: 16px;
      border-radius: 12px;
    }
    input:not([type="checkbox"]), textarea, button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    textarea { min-height: 110px; }
    label { display: block; margin-top: 14px; }
    input[type="checkbox"] { width: auto; }
    button {
      background: #176b43;
      color: white;
      border: 0;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; }
    footer { text-align: center; padding: 20px; }
  </style>
</head>
<body>
  <header>
    <h1>ग्राम पंचायत की जानकारी</h1>
    <p>उम्मीदवार का परिचय एवं जनसंपर्क</p>
  </header>

  <main>
    <section>
      <h2>उम्मीदवार का परिचय</h2>
      <p>यहाँ उम्मीदवार का परिचय और सार्वजनिक विकास संबंधी प्राथमिकताएँ लिखें।</p>
    </section>

    <section>
      <h2>जनसंपर्क फॉर्म</h2>
      <p>अपनी समस्या या सुझाव दर्ज करें।</p>

      <form id="contactForm">
        <input name="full_name" placeholder="आपका पूरा नाम"
          maxlength="100" autocomplete="name" required>

        <input name="phone" type="tel" placeholder="मोबाइल नंबर"
          maxlength="20" autocomplete="tel" required>

        <input name="village" placeholder="आपके ग्राम का नाम"
          maxlength="100" required>

        <textarea name="message"
          placeholder="अपनी समस्या या सुझाव लिखें"
          maxlength="3000" required></textarea>

        <label>
          <input type="checkbox" name="consent_contact" required>
          मैं जनसंपर्क अनुरोध के लिए अपनी जानकारी देने की सहमति देता/देती हूँ।
        </label>

        <label>
          <input type="checkbox" name="consent_voice">
          मैं वॉइस संपर्क के लिए सहमति देता/देती हूँ।
        </label>

        <button id="submitBtn" type="submit">अनुरोध जमा करें</button>
      </form>
      <p id="result" role="status" aria-live="polite"></p>
    </section>
  </main>

  <footer><small>जनसंपर्क वेबसाइट</small></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://bwqyokgeyizvabyhgdsv.supabase.co";
    const SUPABASE_KEY = "sb_publishable_uHikwgUrZSRqLUC4IqBdxQ_dGGnsGtT";

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const form = document.getElementById("contactForm");
    const result = document.getElementById("result");
    const button = document.getElementById("submitBtn");

    form.addEventListener("submit", async function(e) {
      e.preventDefault();

      const data = {
        full_name: form.elements.full_name.value.trim(),
        phone: form.elements.phone.value.trim(),
        village: form.elements.village.value.trim(),
        message: form.elements.message.value.trim(),
        consent_contact: form.elements.consent_contact.checked,
        consent_voice: form.elements.consent_voice.checked
      };

      if (!data.consent_contact) {
        result.textContent = "कृपया जनसंपर्क की सहमति दें।";
        return;
      }

      button.disabled = true;
      result.textContent = "अनुरोध जमा हो रहा है...";

      try {
        const { error } = await db
          .from("contact_requests")
          .insert([data]);

        if (error) throw error;

        result.textContent = "आपका अनुरोध सफलतापूर्वक जमा हो गया।";
        form.reset();
      } catch (error) {
        console.error("Supabase submission error:", error);
        result.textContent =
          "अनुरोध जमा नहीं हुआ। कृपया सेटिंग या अनुमति जाँचें।";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
